components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "access_token"
      description: "JWT 15 phút trong cookie HttpOnly (ADR-0004)"
  parameters:
    Page:
      name: "page"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        default: 1
    PageSize:
      name: "pageSize"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
    AccountId:
      name: "accountId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    PositionId:
      name: "positionId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    OrgUnitId:
      name: "orgUnitId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    HeadAssignmentId:
      name: "headAssignmentId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    EmployeeId:
      name: "employeeId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    ContractId:
      name: "contractId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    LeaveTypeId:
      name: "leaveTypeId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    LeaveRequestId:
      name: "leaveRequestId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    NotificationId:
      name: "notificationId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
  schemas:
    Problem:
      description: "RFC 9457 Problem Details, thêm `code` theo nghĩa nghiệp vụ."
      type: "object"
      properties:
        type:
          type: "string"
          example: "about:blank"
        title:
          type: "string"
          example: "Không đủ phép năm"
        status:
          type: "integer"
          example: 409
        detail:
          type: "string"
          description: "Thông báo tiếng Việt hiển thị được cho người dùng"
        code:
          type: "string"
          description: "Mã lỗi ổn định, liệt kê ở bảng Errors trong docs/design/api.md"
          example: "leave_insufficient_balance"
        rule:
          type: "string"
          description: "Mã luật trong docs/domain.md, nếu có"
          example: "BR-053"
        errors:
          description: "Lỗi theo từng field khi `code` là `validation_failed`"
          type: "object"
          additionalProperties:
            type: "array"
            items:
              type: "string"
        traceId:
          type: "string"
      required: ["type", "title", "status", "code"]
    PageMeta:
      type: "object"
      properties:
        page:
          type: "integer"
        pageSize:
          type: "integer"
        totalItems:
          type: "integer"
        totalPages:
          type: "integer"
      required: ["page", "pageSize", "totalItems", "totalPages"]
    Me:
      type: "object"
      properties:
        accountId:
          type: "string"
          format: "uuid"
        employeeId:
          type: "string"
          format: "uuid"
        code:
          type: "string"
        fullName:
          type: "string"
        roles:
          type: "array"
          items:
            type: "string"
            enum: ["employee", "manager", "hr"]
        mustChangePassword:
          type: "boolean"
          description: "Đúng thì client chỉ cho đổi mật khẩu (BR-002)"
      required: ["accountId", "employeeId", "code", "fullName", "roles", "mustChangePassword"]
    Account:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        employeeId:
          type: "string"
          format: "uuid"
        employeeCode:
          type: "string"
        fullName:
          type: "string"
        status:
          type: "string"
          enum: ["active", "throttled", "locked"]
        isHr:
          type: "boolean"
      required: ["id", "employeeId", "employeeCode", "fullName", "status", "isHr"]
    AccountPage:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Account"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required: ["items", "meta"]
    AccountWithTemporaryPassword:
      type: "object"
      properties:
        account:
          $ref: "#/components/schemas/Account"
        temporaryPassword:
          type: "string"
      required: ["account", "temporaryPassword"]
    Position:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        active:
          type: "boolean"
      required: ["id", "name", "active"]
    PositionInput:
      type: "object"
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
        active:
          type: "boolean"
      required: ["name"]
    OrgUnit:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        parentId:
          type: "string"
          format: "uuid"
          nullable: true
        validFrom:
          type: "string"
          format: "date"
        validTo:
          type: "string"
          format: "date"
          nullable: true
      required: ["id", "name", "validFrom"]
    OrgUnitNode:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        head:
          $ref: "#/components/schemas/EmployeeRef"
          nullable: true
        employeeCount:
          type: "integer"
        children:
          type: "array"
          items:
            $ref: "#/components/schemas/OrgUnitNode"
      required: ["id", "name", "employeeCount", "children"]
    OrgUnitCreate:
      type: "object"
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
        parentId:
          type: "string"
          format: "uuid"
        effectiveDate:
          type: "string"
          format: "date"
      required: ["name", "parentId", "effectiveDate"]
    OrgUnitChange:
      type: "object"
      properties:
        effectiveDate:
          type: "string"
          format: "date"
        name:
          type: "string"
          maxLength: 100
          minLength: 1
        parentId:
          type: "string"
          format: "uuid"
      required: ["effectiveDate"]
    HeadAssignment:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        orgUnitId:
          type: "string"
          format: "uuid"
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        from:
          type: "string"
          format: "date"
        to:
          type: "string"
          format: "date"
          nullable: true
      required: ["id", "orgUnitId", "employee", "from"]
    EmployeeRef:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        code:
          type: "string"
        fullName:
          type: "string"
      required: ["id", "code", "fullName"]
    EmployeeSummary:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        code:
          type: "string"
        fullName:
          type: "string"
        status:
          type: "string"
          enum: ["upcoming", "active", "terminated"]
        orgUnit:
          $ref: "#/components/schemas/NamedRef"
        position:
          $ref: "#/components/schemas/NamedRef"
        workEmail:
          type: "string"
        workPhone:
          type: "string"
      required: ["id", "code", "fullName", "status"]
    NamedRef:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
      required: ["id", "name"]
    EmployeePage:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/EmployeeSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required: ["items", "meta"]
    PersonalInfo:
      type: "object"
      properties:
        dateOfBirth:
          type: "string"
          format: "date"
        gender:
          type: "string"
          enum: ["male", "female", "other"]
        nationalId:
          type: "string"
          maxLength: 12
          minLength: 12
        permanentAddress:
          type: "string"
        currentAddress:
          type: "string"
        personalPhone:
          type: "string"
        personalEmail:
          type: "string"
        bankAccount:
          $ref: "#/components/schemas/BankAccount"
        emergencyContact:
          $ref: "#/components/schemas/EmergencyContact"
      required: ["dateOfBirth", "gender", "nationalId"]
    BankAccount:
      type: "object"
      properties:
        bankName:
          type: "string"
        accountNumber:
          type: "string"
      required: ["bankName", "accountNumber"]
    EmergencyContact:
      type: "object"
      properties:
        name:
          type: "string"
        relationship:
          type: "string"
        phone:
          type: "string"
      required: ["name", "phone"]
    EmployeeDetail:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        code:
          type: "string"
        fullName:
          type: "string"
        status:
          type: "string"
          enum: ["upcoming", "active", "terminated"]
        version:
          type: "integer"
        workEmail:
          type: "string"
        workPhone:
          type: "string"
        employment:
          type: "object"
          properties:
            hireDate:
              type: "string"
              format: "date"
            lastWorkingDate:
              type: "string"
              format: "date"
              nullable: true
            orgUnit:
              $ref: "#/components/schemas/NamedRef"
            position:
              $ref: "#/components/schemas/NamedRef"
            lineManager:
              $ref: "#/components/schemas/EmployeeRef"
              nullable: true
          required: ["hireDate"]
        personal:
          $ref: "#/components/schemas/PersonalInfo"
          description: "Chỉ có khi người xem là HR hoặc chính nhân viên (BR-033)"
        warnings:
          type: "array"
          items:
            type: "string"
            description: "Ví dụ `no_contract` (EC-017)"
      required: ["id", "code", "fullName", "status", "version", "employment"]
    EmployeeCreate:
      type: "object"
      properties:
        fullName:
          type: "string"
          maxLength: 100
          minLength: 1
        personal:
          $ref: "#/components/schemas/PersonalInfo"
        workEmail:
          type: "string"
        workPhone:
          type: "string"
        hireDate:
          type: "string"
          format: "date"
        orgUnitId:
          type: "string"
          format: "uuid"
        positionId:
          type: "string"
          format: "uuid"
        firstContract:
          $ref: "#/components/schemas/ContractInput"
      required: ["fullName", "personal", "hireDate", "orgUnitId", "positionId"]
    EmployeeUpdate:
      type: "object"
      properties:
        version:
          type: "integer"
          description: "Giá trị đã đọc; khác thì trả `version_conflict` (EC-016)"
        fullName:
          type: "string"
          maxLength: 100
          minLength: 1
        workEmail:
          type: "string"
        workPhone:
          type: "string"
        personal:
          $ref: "#/components/schemas/PersonalInfo"
      required: ["version"]
    SelfProfileUpdate:
      type: "object"
      properties:
        version:
          type: "integer"
        personalPhone:
          type: "string"
        personalEmail:
          type: "string"
        currentAddress:
          type: "string"
        emergencyContact:
          $ref: "#/components/schemas/EmergencyContact"
      required: ["version"]
    Assignment:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        orgUnit:
          $ref: "#/components/schemas/NamedRef"
        position:
          $ref: "#/components/schemas/NamedRef"
        from:
          type: "string"
          format: "date"
        to:
          type: "string"
          format: "date"
          nullable: true
        reason:
          type: "string"
      required: ["id", "orgUnit", "position", "from"]
    AssignmentChange:
      type: "object"
      properties:
        effectiveDate:
          type: "string"
          format: "date"
        orgUnitId:
          type: "string"
          format: "uuid"
        positionId:
          type: "string"
          format: "uuid"
        reason:
          type: "string"
          maxLength: 500
          description: "Bắt buộc khi ngày hiệu lực trước hôm nay (BR-018)"
      required: ["effectiveDate"]
    TerminationInput:
      type: "object"
      properties:
        lastWorkingDate:
          type: "string"
          format: "date"
        reason:
          type: "string"
          maxLength: 500
          minLength: 1
      required: ["lastWorkingDate", "reason"]
    ContractInput:
      type: "object"
      properties:
        number:
          type: "string"
          maxLength: 50
          minLength: 1
        type:
          type: "string"
          enum: ["probation", "fixed_term", "indefinite"]
        probationGroup:
          type: "string"
          enum: ["management", "college", "vocational", "other"]
          description: "Bắt buộc khi `type` là `probation` (BR-028)"
        signedOn:
          type: "string"
          format: "date"
        startDate:
          type: "string"
          format: "date"
        endDate:
          type: "string"
          format: "date"
        version:
          type: "integer"
          description: "Bắt buộc khi sửa"
        acknowledgeWarnings:
          type: "boolean"
          description: "Xác nhận cảnh báo của BR-026"
      required: ["number", "type", "signedOn", "startDate"]
    Contract:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        number:
          type: "string"
        type:
          type: "string"
          enum: ["probation", "fixed_term", "indefinite"]
        probationGroup:
          type: "string"
        signedOn:
          type: "string"
          format: "date"
        startDate:
          type: "string"
          format: "date"
        endDate:
          type: "string"
          format: "date"
          nullable: true
        status:
          type: "string"
          enum: ["upcoming", "active", "expired", "terminated"]
        version:
          type: "integer"
        warnings:
          type: "array"
          items:
            type: "string"
      required: ["id", "number", "type", "signedOn", "startDate", "status", "version"]
    ExpiringContract:
      type: "object"
      properties:
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        contract:
          $ref: "#/components/schemas/Contract"
        daysLeft:
          type: "integer"
      required: ["employee", "contract", "daysLeft"]
    LeaveType:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        payMode:
          type: "string"
          enum: ["company_paid", "social_insurance", "unpaid"]
        deductsAnnual:
          type: "boolean"
        maxDaysPerRequest:
          type: "number"
          multipleOf: 0.5
          nullable: true
        active:
          type: "boolean"
        isAnnual:
          type: "boolean"
          description: "Loại Phép năm, không xóa hay ngừng được (BR-041)"
      required: ["id", "name", "payMode", "deductsAnnual", "active", "isAnnual"]
    LeaveTypeInput:
      type: "object"
      properties:
        name:
          type: "string"
          maxLength: 100
          minLength: 1
        payMode:
          type: "string"
          enum: ["company_paid", "social_insurance", "unpaid"]
        deductsAnnual:
          type: "boolean"
        maxDaysPerRequest:
          type: "number"
          multipleOf: 0.5
        active:
          type: "boolean"
      required: ["name", "payMode", "deductsAnnual"]
    CalendarDay:
      type: "object"
      properties:
        day:
          type: "string"
          format: "date"
        kind:
          type: "string"
          enum: ["holiday", "makeup_workday"]
        name:
          type: "string"
          maxLength: 100
          minLength: 1
      required: ["day", "kind", "name"]
    CalendarDayResult:
      type: "object"
      properties:
        day:
          $ref: "#/components/schemas/CalendarDay"
        affectedRequests:
          type: "array"
          items:
            $ref: "#/components/schemas/LeaveRequest"
        warnings:
          type: "array"
          items:
            type: "string"
            description: "Ví dụ số phép tạm âm (EC-032)"
      required: ["affectedRequests"]
    LedgerEntry:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        date:
          type: "string"
          format: "date"
        kind:
          type: "string"
          enum: ["accrual", "carryover_in", "carryover_expired", "carryover_capped", "taken", "refund", "adjustment"]
        days:
          type: "number"
          multipleOf: 0.5
          description: "Có dấu: dương là cộng, âm là trừ"
        leaveYear:
          type: "integer"
        isCarryover:
          type: "boolean"
        expiresOn:
          type: "string"
          format: "date"
          nullable: true
        leaveRequestId:
          type: "string"
          format: "uuid"
          nullable: true
        reason:
          type: "string"
      required: ["id", "date", "kind", "days", "leaveYear", "isCarryover"]
    LeaveBalance:
      type: "object"
      properties:
        employeeId:
          type: "string"
          format: "uuid"
        year:
          type: "integer"
        annualEntitlement:
          type: "number"
          multipleOf: 0.5
        balance:
          type: "number"
          multipleOf: 0.5
          description: "Tổng các biến động (BR-054)"
        carryover:
          type: "object"
          properties:
            days:
              type: "number"
              multipleOf: 0.5
            expiresOn:
              type: "string"
              format: "date"
              nullable: true
          required: ["days"]
        pendingDays:
          type: "number"
          multipleOf: 0.5
          description: "Đơn phép năm đang chờ, chưa trừ"
        entries:
          type: "array"
          items:
            $ref: "#/components/schemas/LedgerEntry"
      required: ["employeeId", "year", "balance", "carryover", "pendingDays", "entries"]
    LeaveRequestCreate:
      type: "object"
      properties:
        leaveTypeId:
          type: "string"
          format: "uuid"
        startDate:
          type: "string"
          format: "date"
        startHalf:
          type: "string"
          enum: ["morning", "afternoon"]
        endDate:
          type: "string"
          format: "date"
        endHalf:
          type: "string"
          enum: ["morning", "afternoon"]
        reason:
          type: "string"
          maxLength: 500
      required: ["leaveTypeId", "startDate", "startHalf", "endDate", "endHalf"]
    LeavePreview:
      type: "object"
      properties:
        days:
          type: "number"
          multipleOf: 0.5
        balanceAfter:
          type: "number"
          multipleOf: 0.5
          nullable: true
        approver:
          $ref: "#/components/schemas/EmployeeRef"
          nullable: true
      required: ["days"]
    LeaveRequest:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        leaveType:
          $ref: "#/components/schemas/NamedRef"
        startDate:
          type: "string"
          format: "date"
        startHalf:
          type: "string"
          enum: ["morning", "afternoon"]
        endDate:
          type: "string"
          format: "date"
        endHalf:
          type: "string"
          enum: ["morning", "afternoon"]
        days:
          type: "number"
          multipleOf: 0.5
        status:
          type: "string"
          enum: ["pending", "approved", "rejected", "cancelled"]
        reason:
          type: "string"
          nullable: true
          description: "Trống với Quản lý không phải người duyệt (BR-067)"
        approver:
          $ref: "#/components/schemas/EmployeeRef"
          nullable: true
        decisionReason:
          type: "string"
          nullable: true
        overdue:
          type: "boolean"
          description: "Đang chờ mà đã qua ngày bắt đầu (EC-029)"
        createdAt:
          type: "string"
          format: "date-time"
      required: ["id", "employee", "leaveType", "startDate", "startHalf", "endDate", "endHalf", "days", "status"]
    LeaveRequestPage:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/LeaveRequest"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required: ["items", "meta"]
    ReasonInput:
      type: "object"
      properties:
        reason:
          type: "string"
          maxLength: 500
          minLength: 1
      required: ["reason"]
    OptionalReasonInput:
      type: "object"
      properties:
        reason:
          type: "string"
          maxLength: 500
          description: "Bắt buộc khi HR hủy (BR-061)"
    Notification:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        kind:
          type: "string"
          enum: ["leave_submitted", "leave_approved", "leave_rejected", "leave_cancelled", "leave_reassigned"]
        leaveRequestId:
          type: "string"
          format: "uuid"
        message:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        read:
          type: "boolean"
      required: ["id", "kind", "createdAt", "read"]
    NotificationPage:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Notification"
        meta:
          $ref: "#/components/schemas/PageMeta"
        unreadCount:
          type: "integer"
      required: ["items", "meta", "unreadCount"]
    Overview:
      type: "object"
      properties:
        activeEmployees:
          type: "integer"
        hiredThisMonth:
          type: "integer"
        terminatedThisMonth:
          type: "integer"
        onLeaveToday:
          type: "integer"
        pendingApprovals:
          type: "integer"
        expiringContracts:
          type: "integer"
          description: "Chỉ HR"
      required: ["activeEmployees", "hiredThisMonth", "terminatedThisMonth", "onLeaveToday", "pendingApprovals"]
    HeadcountMovementRow:
      type: "object"
      properties:
        month:
          type: "string"
          pattern: "^\\d{4}-\\d{2}$"
          example: "2026-05"
        orgUnit:
          $ref: "#/components/schemas/NamedRef"
        opening:
          type: "integer"
        hired:
          type: "integer"
        terminated:
          type: "integer"
        transferredIn:
          type: "integer"
        transferredOut:
          type: "integer"
        closing:
          type: "integer"
        turnoverRate:
          type: "number"
          description: "BR-132, từ 0 tới 1"
      required: ["month", "orgUnit", "opening", "hired", "terminated", "transferredIn", "transferredOut", "closing", "turnoverRate"]
    HeadcountMovementReport:
      type: "object"
      properties:
        rows:
          type: "array"
          items:
            $ref: "#/components/schemas/HeadcountMovementRow"
      required: ["rows"]
    LeaveUsageRow:
      type: "object"
      properties:
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        orgUnit:
          $ref: "#/components/schemas/NamedRef"
        byType:
          type: "array"
          items:
            type: "object"
            properties:
              leaveType:
                $ref: "#/components/schemas/NamedRef"
              days:
                type: "number"
                multipleOf: 0.5
            required: ["leaveType", "days"]
      required: ["employee", "orgUnit", "byType"]
    LeaveUsageReport:
      type: "object"
      properties:
        rows:
          type: "array"
          items:
            $ref: "#/components/schemas/LeaveUsageRow"
      required: ["rows"]
    LeaveBalancesRow:
      type: "object"
      properties:
        employee:
          $ref: "#/components/schemas/EmployeeRef"
        orgUnit:
          $ref: "#/components/schemas/NamedRef"
        balance:
          type: "number"
          multipleOf: 0.5
        carryoverDays:
          type: "number"
          multipleOf: 0.5
        carryoverExpiresOn:
          type: "string"
          format: "date"
          nullable: true
      required: ["employee", "orgUnit", "balance", "carryoverDays"]
    LeaveBalancesReport:
      type: "object"
      properties:
        date:
          type: "string"
          format: "date"
        rows:
          type: "array"
          items:
            $ref: "#/components/schemas/LeaveBalancesRow"
      required: ["date", "rows"]
  responses:
    ValidationError:
      description: "Đầu vào không hợp lệ (`validation_failed`) hoặc vi phạm luật về giá trị"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "Chưa đăng nhập, phiên hết hạn, hoặc sai mã nhân viên hay mật khẩu"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "Đã đăng nhập nhưng không đủ vai trò, hoặc phải đổi mật khẩu trước (`password_change_required`)"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "Không có tài nguyên, hoặc người gọi không được biết tài nguyên đó tồn tại"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "Xung đột với dữ liệu hiện tại: trùng, chồng khoảng, sai trạng thái, hết phép"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: "Quá nhiều lần đăng nhập từ một IP (`rate_limited`)"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Locked:
      description: "Tài khoản đang bị khóa tạm do nhập sai nhiều lần (`account_throttled`, BR-003)"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
