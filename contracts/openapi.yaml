  responses:
    Unauthorized:
      description: "`unauthenticated`: chưa đăng nhập hoặc phiên hết hạn; `invalid_credentials` khi đăng nhập sai"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Forbidden:
      description: "`forbidden`, `out_of_scope`, `password_change_required`, `account_throttled`, `account_locked`, hoặc thiếu X-CSRF-Token"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    NotFound:
      description: "`not_found`: không có, hoặc người gọi không được biết đối tượng tồn tại"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Conflict:
      description: "Xung đột với trạng thái hay dữ liệu hiện có; `code` theo bảng Errors trong api.md"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    PreconditionFailed:
      description: "`stale_version`: dữ liệu đã đổi từ khi mở"
      content:
