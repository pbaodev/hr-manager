# Contract HTTP API của hr-manager, nguồn chính cho client và server (contract-first, chủ dự án chọn 2026-11-03).
# Quy ước chung, bảng lỗi và bản đồ story → operation nằm ở docs/design/api.md.
# Hiện có đủ M1. M2 tới M6 thêm ở các PR sau của #10, theo bảng Operations trong api.md.
# CI (job "contract") lint file này bằng Redocly, cấu hình ở redocly.yaml. Endpoint vận hành như health check ghi ở runbook.
openapi: "3.0.3"
info:
  title: HR Manager API
  version: "0.1.0"
  description: "API của web client HR Manager. Lỗi theo RFC 9457 kèm `code`; mỗi `code` dẫn tới một luật trong docs/analysis/domain.md, xem docs/design/api.md. Hiện có M1."
  license:
    name: MIT
    url: "https://opensource.org/licenses/MIT"
servers:
  - url: "http://localhost:8000/api/v1"
    description: Local
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: "Đăng nhập, phiên, đổi mật khẩu (ADR-0010)"
  - name: Accounts
    description: Tài khoản và vai trò HR
  - name: Organization
    description: Phòng ban, trưởng phòng ban, chức danh
  - name: Employees
    description: Hồ sơ, tiếp nhận, thay đổi công tác, nghỉ việc
  - name: Contracts
    description: Hợp đồng lao động
  - name: Me
    description: Dữ liệu của người đang đăng nhập
  - name: Policies
    description: Thư viện quy chế theo phiên bản
  - name: Questions
    description: Câu hỏi gửi HR
  - name: Notifications
    description: Thông báo trong hệ thống
paths:
  "/auth/login":
    post:
      tags:
        - Auth
      summary: "Đăng nhập bằng mã nhân viên và mật khẩu (US-001)"
      operationId: login
      description: "Sai mã hoặc mật khẩu trả `invalid_credentials`, không nói phần nào sai. Khóa tạm trả `account_throttled` (BR-003); tài khoản bị khóa trả `account_locked` (BR-005)."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Đã đăng nhập; cookie phiên được đặt"
          headers:
            Set-Cookie:
              description: "Cookie phiên `hrm_session`, HttpOnly, Secure, SameSite=Lax"
              schema:
                type: string
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/auth/logout":
    post:
      tags:
        - Auth
      summary: "Đăng xuất, xóa phiên hiện tại"
      operationId: logout
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: "Đã đăng xuất"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/auth/session":
    get:
      tags:
        - Auth
      summary: "Phiên hiện tại: tài khoản, vai trò, phạm vi"
      operationId: getSession
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/auth/password":
    post:
      tags:
        - Auth
      summary: "Đổi mật khẩu của tôi (US-001)"
      operationId: changePassword
      description: "Lỗi `current_password_incorrect`, `password_too_short`, `password_reused` (BR-036). Gọi được cả khi phải đổi mật khẩu (BR-002)."
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: "Đã đổi; các phiên khác bị xóa"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  "/accounts":
    get:
      tags:
        - Accounts
      summary: Danh sách tài khoản (US-002)
      operationId: listAccounts
      description: Chỉ HR.
      parameters:
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/PageSize"
        - "$ref": "#/components/parameters/Search"
        - name: status
          in: query
          required: false
          schema:
            "$ref": "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AccountPage"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/employees/{employeeId}/account":
    post:
      tags:
        - Accounts
      summary: Tạo tài khoản cho nhân viên (US-002)
      operationId: createAccount
      description: "Chỉ HR. Tên đăng nhập là mã nhân viên; người dùng phải đổi mật khẩu ở lần đăng nhập đầu (BR-001, BR-002). Đã có tài khoản thì `account_exists`."
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/EmployeeId"
      responses:
        "201":
          description: "Đã tạo; mật khẩu tạm chỉ trả trong response này"
          headers:
            Location:
              description: URL của tài nguyên vừa tạo
              schema:
                type: string
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AccountWithTemporaryPassword"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/accounts/{accountId}/lock":
    post:
      tags:
        - Accounts
      summary: Khóa tài khoản (US-002)
      operationId: lockAccount
      description: "Chỉ HR. Mọi phiên của tài khoản bị xóa. Khóa HR đang hoạt động cuối cùng thì `last_active_hr` (BR-004)."
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/AccountId"
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Account"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/accounts/{accountId}/unlock":
    post:
      tags:
        - Accounts
      summary: Mở khóa tài khoản (US-002)
      operationId: unlockAccount
      description: "Chỉ HR. Nhân viên đã nghỉ việc thì `employee_terminated` (BR-005)."
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/AccountId"
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Account"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/accounts/{accountId}/reset-password":
    post:
      tags:
        - Accounts
      summary: "Đặt lại mật khẩu (US-002)"
      operationId: resetPassword
      description: Chỉ HR. Người dùng phải đổi mật khẩu ở lần đăng nhập sau (BR-002).
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/AccountId"
      responses:
        "200":
          description: "Mật khẩu tạm, chỉ trả một lần; mọi phiên bị xóa"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TemporaryPassword"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/accounts/{accountId}/hr-role":
    put:
      tags:
        - Accounts
      summary: Gán hoặc thu hồi vai trò HR (US-003)
      operationId: setHrRole
      description: "Chỉ HR. Mọi phiên của tài khoản đó bị xóa để quyền mới có tác dụng ngay. Thu hồi HR đang hoạt động cuối cùng thì `last_active_hr` (BR-004)."
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - isHr
              properties:
                isHr:
                  type: boolean
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Account"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/positions":
    get:
      tags:
        - Organization
      summary: Danh mục chức danh (US-005)
      operationId: listPositions
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PositionList"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      tags:
        - Organization
      summary: Thêm chức danh (US-005)
      operationId: createPosition
      description: "Chỉ HR. Tên trùng, không phân biệt hoa thường, thì `position_name_taken` (BR-034)."
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PositionInput"
      responses:
        "201":
          description: "Đã tạo"
          headers:
            Location:
              description: URL của tài nguyên vừa tạo
              schema:
                type: string
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Position"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  "/positions/{positionId}":
    patch:
      tags:
        - Organization
      summary: Sửa tên hoặc ngừng dùng chức danh (US-005)
      operationId: updatePosition
      description: Chỉ HR.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/PositionId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PositionPatch"
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Position"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
    delete:
      tags:
        - Organization
      summary: Xóa chức danh chưa được dùng (US-005)
      operationId: deletePosition
      description: "Chỉ HR. Chức danh đã dùng thì `position_in_use`; chỉ ngừng dùng được (BR-035)."
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/PositionId"
      responses:
        "204":
          description: "Đã xóa"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/org-units":
    get:
      tags:
        - Organization
      summary: Cây phòng ban tại một ngày (US-006, US-009)
      operationId: listOrgUnits
      description: "Phòng ban chưa thành lập hoặc đã giải thể tại `asOf` không có trong kết quả, trừ khi `includeInactive`. Mỗi phòng ban kèm trưởng và số nhân viên đang làm."
      parameters:
        - "$ref": "#/components/parameters/AsOf"
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgUnitList"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      tags:
        - Organization
      summary: Tạo phòng ban (US-006)
      operationId: createOrgUnit
      description: "Chỉ HR. Phòng ban cha không hoạt động tại ngày thành lập thì `org_unit_parent_inactive`."
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OrgUnitCreate"
      responses:
        "201":
          description: "Đã tạo"
          headers:
            Location:
              description: URL của tài nguyên vừa tạo
              schema:
                type: string
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgUnit"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  "/org-units/{orgUnitId}/changes":
    post:
      tags:
        - Organization
      summary: "Đổi tên, đổi phòng ban cha hoặc giải thể từ một ngày (US-006)"
      operationId: changeOrgUnit
      description: "Chỉ HR. Thay đổi có tác dụng từ `effectiveOn` (BR-009). Tạo vòng thì `org_unit_cycle` (BR-008); giải thể khi còn người hoặc phòng ban con thì `org_unit_not_empty` (BR-010)."
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/OrgUnitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OrgUnitChange"
      responses:
        "201":
          description: "Đã ghi thay đổi"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrgUnit"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  "/org-units/{orgUnitId}/heads":
    post:
      tags:
        - Organization
      summary: Bổ nhiệm trưởng phòng ban (US-008)
      operationId: appointHead
      description: "Chỉ HR. Phòng ban đã có trưởng thì bổ nhiệm cũ kết thúc ngày trước `from` (BR-011). Người được bổ nhiệm không làm việc trong cả khoảng thì `head_not_employed`."
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/OrgUnitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/HeadAppointment"
      responses:
        "201":
          description: "Đã bổ nhiệm"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HeadAssignment"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  "/head-assignments/{headAssignmentId}/end":
    post:
      tags:
        - Organization
      summary: Thôi bổ nhiệm trưởng phòng ban (US-008)
      operationId: endHeadAssignment
      description: "Chỉ HR. Người đó mất vai trò Quản lý từ ngày sau `lastDay` nếu không còn là trưởng phòng ban nào."
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: headAssignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - lastDay
              properties:
                lastDay:
                  type: string
                  format: date
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HeadAssignment"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  "/employees":
    get:
      tags:
        - Employees
      summary: Tìm và lọc nhân viên (US-018, US-020)
      operationId: listEmployees
      description: "Quản lý chỉ thấy nhân viên trong phạm vi; lọc theo phòng ban ngoài phạm vi thì `out_of_scope` (BR-013). `search` không phân biệt dấu và hoa thường (EC-019)."
      parameters:
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/PageSize"
        - "$ref": "#/components/parameters/Search"
        - name: orgUnitId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: includeSubunits
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: status
          in: query
          required: false
          schema:
            "$ref": "#/components/schemas/EmployeeStatus"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - fullName
              - "-fullName"
              - employeeCode
              - "-employeeCode"
              - hireDate
              - "-hireDate"
            default: fullName
      responses:
        "200":
          description: Thành công
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EmployeeSummaryPage"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
    post:
      tags:
        - Employees
      summary: Tiếp nhận nhân viên mới (US-011)
      operationId: hireEmployee
      description: "Chỉ HR. Tạo cả hoặc không gì. Mã nhân viên do hệ thống cấp (BR-015). Ngày vào làm ở tương lai thì hồ sơ ở trạng thái `upcoming` (EC-001). Số CCCD trùng thì `national_id_taken` kèm `existingEmployeeId` (BR-022)."
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/HireRequest"
      responses:
        "201":
          description: "Đã tạo hồ sơ, quá trình công tác và hợp đồng nếu có"
          headers:
            Location:
              description: URL của tài nguyên vừa tạo
              schema:
                type: string
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Employee"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
  "/employees/{employeeId}":
    get:
      tags:
        - Employees
      summary: Hồ sơ nhân viên (US-012, US-018)
      operationId: getEmployee
      description: "HR thấy đủ. Quản lý trong phạm vi chỉ nhận phần công việc; các trường ở BR-033 không có trong response. Ngoài phạm vi thì `not_found`."
      parameters:
        - "$ref": "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Thành công
          headers:
            ETag:
              description: "Version hiện tại; gửi lại trong If-Match khi sửa"
              schema:
                type: string
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Employee"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
    patch:
      tags:
        - Employees
      summary: Sửa hồ sơ nhân viên (US-012)
      operationId: updateEmployee
      description: "Chỉ HR. Phòng ban và chức danh đổi qua `POST /employees/{employeeId}/assignments`; mã nhân viên không sửa được (BR-015). `If-Match` lệch thì `stale_version` (EC-016). Mỗi lần sửa ghi nhật ký (BR-030)."
      security:
