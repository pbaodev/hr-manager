components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hrm_session
      description: Phiên lưu ở server (ADR-0010)
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: "Giá trị csrfToken trong Session; bắt buộc ở request ghi"
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      required: false
      description: Không phân biệt dấu và hoa thường (EC-019)
      schema:
        type: string
        maxLength: 100
    AsOf:
      name: asOf
      in: query
      required: false
      description: "Xem tại một ngày; mặc định hôm nay"
      schema:
        type: string
        format: date
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag nhận khi đọc (EC-016)
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Gửi lại cùng key trong 24 giờ thì nhận lại kết quả lần đầu
      schema:
        type: string
        maxLength: 64
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgUnitId:
      name: orgUnitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details, thêm code theo nghĩa nghiệp vụ.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          example: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Mã lỗi ổn định, liệt kê ở bảng Errors trong docs/design/api.md
          example: contract_overlap
        errors:
          type: object
          description: Lỗi theo field khi code là validation_failed
          additionalProperties:
            type: array
            items:
              type: string
        existingEmployeeId:
          type: string
          format: uuid
          description: Khi code là national_id_taken
        blockers:
          type: array
          description: "Khi code là changes_after_last_day: các thay đổi cần hủy"
          items:
            type: object
            additionalProperties: true
        retryAfter:
          type: string
          format: date-time
          description: Khi code là account_throttled
        traceId:
          type: string
    Warning:
      type: object
      required:
        - code
        - detail
      properties:
        code:
          type: string
          example: consecutive_fixed_term
        detail:
          type: string
    PageMeta:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    NotificationPageMeta:
      allOf:
        - "$ref": "#/components/schemas/PageMeta"
        - type: object
          required:
            - unreadCount
          properties:
            unreadCount:
              type: integer
    Role:
      type: string
      enum:
        - employee
        - manager
        - hr
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 20
          description: Mã nhân viên
          example: NV00026
        password:
          type: string
          minLength: 1
          maxLength: 200
          format: password
    PasswordChange:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
          format: password
        newPassword:
          type: string
          minLength: 1
          maxLength: 200
          format: password
          description: Tối thiểu min_password_length ký tự, khác mật khẩu hiện tại (BR-036)
    Session:
      type: object
      required:
        - accountId
        - employeeId
        - employeeCode
        - fullName
        - roles
        - mustChangePassword
        - csrfToken
        - expiresAt
      properties:
        accountId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        employeeCode:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            "$ref": "#/components/schemas/Role"
        managedOrgUnitIds:
          type: array
          description: "Phòng ban làm trưởng hôm nay; phạm vi gồm cả phòng ban con (BR-013)"
          items:
            type: string
            format: uuid
        mustChangePassword:
          type: boolean
          description: "Đúng thì mọi operation khác trả password_change_required (BR-002)"
        csrfToken:
          type: string
          description: Gửi lại trong header X-CSRF-Token ở mọi request ghi
        expiresAt:
          type: string
          format: date-time
    AccountStatus:
      type: string
      enum:
        - active
        - throttled
        - locked
    Account:
      type: object
      required:
        - id
        - employeeId
        - username
        - isHr
        - status
        - mustChangePassword
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        isHr:
          type: boolean
        status:
          "$ref": "#/components/schemas/AccountStatus"
        mustChangePassword:
          type: boolean
        throttledUntil:
          type: string
          format: date-time
          nullable: true
    AccountPage:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Account"
        meta:
          "$ref": "#/components/schemas/PageMeta"
    TemporaryPassword:
      type: object
      required:
        - temporaryPassword
      properties:
        temporaryPassword:
          type: string
          description: "Chỉ trả một lần; không lưu dạng đọc được"
    AccountWithTemporaryPassword:
      allOf:
        - "$ref": "#/components/schemas/Account"
        - "$ref": "#/components/schemas/TemporaryPassword"
    Position:
      type: object
      required:
        - id
        - name
        - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isActive:
          type: boolean
    PositionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Position"
    PositionInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    PositionPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        isActive:
          type: boolean
    OrgUnitStatus:
      type: string
      enum:
