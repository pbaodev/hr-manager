# Contract HTTP API của hr-manager, nguồn chính cho client và server (contract-first).
# Quy ước chung, bảng mã lỗi và bản đồ story tới operation nằm ở docs/design/api.md.
# CI (job "contract") lint file này bằng Redocly, cấu hình ở redocly.yaml.
openapi: "3.0.3"
info:
  title: "hr-manager API"
  version: "0.1.0"
  description: "Contract cho MVP: các story có ✅ ở cột MVP trong docs/stories.md. Quy ước, bảng mã lỗi và bản đồ story tới operation nằm ở docs/design/api.md.\n\nLỗi trả về theo RFC 9457 (Problem Details), thêm `code` ổn định và `rule` là mã luật trong docs/domain.md."
  license:
    name: "Proprietary"
servers:
  - url: "http://localhost:8000/api/v1"
    description: "Local"
security:
  - cookieAuth: []
tags:
  - name: "Auth"
    description: "Đăng nhập, phiên và mật khẩu (ADR-0004)"
  - name: "Accounts"
    description: "Tài khoản và vai trò HR"
  - name: "Organization"
    description: "Phòng ban, trưởng phòng ban, chức danh"
  - name: "Employees"
    description: "Hồ sơ, quá trình công tác, hợp đồng"
  - name: "Leave"
    description: "Loại nghỉ, lịch làm việc, số dư phép, đơn nghỉ"
  - name: "Notifications"
    description: "Thông báo trong hệ thống"
  - name: "Reports"
    description: "Báo cáo của MVP"
paths:
  /auth/login:
    post:
      tags: ["Auth"]
      summary: "Đăng nhập bằng mã nhân viên (US-001)"
      operationId: "login"
      description: "**Quyền:** không cần đăng nhập. **Mã lỗi:** `invalid_credentials`, `account_throttled`. Quá `login_rate_limit_per_ip` lần mỗi phút từ một IP thì trả 429 `rate_limited`."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                code:
                  type: "string"
                  maxLength: 20
                password:
                  type: "string"
                  maxLength: 128
              required: ["code", "password"]
      responses:
        "200":
          description: "Đăng nhập thành công; đặt cookie `access_token` và `refresh_token`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags: ["Auth"]
      summary: "Đổi refresh token lấy cặp token mới (ADR-0004)"
      operationId: "refreshSession"
      description: "**Quyền:** người có cookie `refresh_token` hợp lệ. **Mã lỗi:** `unauthenticated`."
      security: []
      responses:
        "204":
          description: "Đã đặt cookie mới"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: ["Auth"]
      summary: "Đăng xuất, thu hồi refresh token hiện tại"
      operationId: "logout"
      description: "**Quyền:** mọi người đã đăng nhập."
      responses:
        "204":
          description: "Đã xóa cookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      tags: ["Auth"]
      summary: "Thông tin người đang đăng nhập, vai trò và cờ phải đổi mật khẩu"
      operationId: "getMe"
      description: "**Quyền:** mọi người đã đăng nhập."
      responses:
        "200":
          description: "Người dùng hiện tại"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/password:
    post:
      tags: ["Auth"]
      summary: "Đổi mật khẩu của mình (US-001)"
      operationId: "changeMyPassword"
      description: "**Quyền:** mọi người đã đăng nhập. **Mã lỗi:** `invalid_credentials`, `password_too_short`, `password_reused`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                currentPassword:
                  type: "string"
                  maxLength: 128
                newPassword:
                  type: "string"
                  maxLength: 128
                  minLength: 8
              required: ["currentPassword", "newPassword"]
      responses:
        "204":
          description: "Đã đổi; mọi phiên khác bị thu hồi"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /accounts:
    get:
      tags: ["Accounts"]
      summary: "Danh sách tài khoản (US-002)"
      operationId: "listAccounts"
      description: "**Quyền:** HR."
      parameters:
        - name: "search"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Tìm theo mã hoặc tên, không phân biệt dấu"
        - name: "status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum: ["active", "throttled", "locked"]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "Một trang tài khoản"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: ["Accounts"]
      summary: "Tạo tài khoản cho một nhân viên (US-002)"
      operationId: "createAccount"
      description: "**Quyền:** HR. **Mã lỗi:** `account_exists`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                employeeId:
                  type: "string"
                  format: "uuid"
              required: ["employeeId"]
      responses:
        "201":
          description: "Đã tạo; mật khẩu tạm chỉ trả về một lần (BR-002)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithTemporaryPassword"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accounts/{accountId}/password-reset:
    post:
      tags: ["Accounts"]
      summary: "Đặt lại mật khẩu, trả mật khẩu tạm (US-002)"
      operationId: "resetAccountPassword"
      description: "**Quyền:** HR."
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: "Mật khẩu tạm, chỉ trả về một lần"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithTemporaryPassword"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /accounts/{accountId}/lock:
    post:
      tags: ["Accounts"]
      summary: "Khóa tài khoản (US-002)"
      operationId: "lockAccount"
      description: "**Quyền:** HR. **Mã lỗi:** `last_hr_account`."
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: "Tài khoản sau khi khóa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accounts/{accountId}/unlock:
    post:
      tags: ["Accounts"]
      summary: "Mở khóa tài khoản (US-002)"
      operationId: "unlockAccount"
      description: "**Quyền:** HR. **Mã lỗi:** `employee_terminated`."
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: "Tài khoản sau khi mở khóa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /accounts/{accountId}/hr-role:
    put:
      tags: ["Accounts"]
      summary: "Gán vai trò HR (US-003)"
      operationId: "grantHrRole"
      description: "**Quyền:** HR."
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: "Đã gán"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: ["Accounts"]
      summary: "Thu hồi vai trò HR (US-003)"
      operationId: "revokeHrRole"
      description: "**Quyền:** HR. **Mã lỗi:** `last_hr_account`."
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: "Đã thu hồi"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /positions:
    get:
      tags: ["Organization"]
      summary: "Danh mục chức danh (US-005)"
      operationId: "listPositions"
      description: "**Quyền:** mọi người đã đăng nhập."
      responses:
        "200":
          description: "Mọi chức danh"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Position"
                required: ["items"]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: ["Organization"]
      summary: "Thêm chức danh (US-005)"
      operationId: "createPosition"
      description: "**Quyền:** HR. **Mã lỗi:** `name_taken`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "201":
          description: "Chức danh mới"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /positions/{positionId}:
    patch:
      tags: ["Organization"]
      summary: "Đổi tên hoặc ngừng dùng chức danh (US-005)"
      operationId: "updatePosition"
      description: "**Quyền:** HR. **Mã lỗi:** `name_taken`."
      parameters:
        - $ref: "#/components/parameters/PositionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "200":
          description: "Chức danh sau khi sửa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /org-units/tree:
    get:
      tags: ["Organization"]
      summary: "Cây tổ chức tại một ngày (US-009)"
      operationId: "getOrgTree"
      description: "**Quyền:** mọi người đã đăng nhập; chỉ HR chọn được ngày khác hôm nay (US-010)."
      parameters:
        - name: "date"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
          description: "Mặc định là hôm nay"
      responses:
        "200":
          description: "Cây phòng ban kèm trưởng và số nhân viên"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /org-units:
    post:
      tags: ["Organization"]
      summary: "Tạo phòng ban (US-006)"
      operationId: "createOrgUnit"
      description: "**Quyền:** HR. **Mã lỗi:** `org_unit_inactive`, `org_root_rule`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitCreate"
      responses:
        "201":
          description: "Phòng ban mới"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /org-units/{orgUnitId}/changes:
    post:
      tags: ["Organization"]
      summary: "Đổi tên hoặc chuyển phòng ban cha từ một ngày hiệu lực (US-006)"
      operationId: "changeOrgUnit"
      description: "**Quyền:** HR. **Mã lỗi:** `org_cycle`, `org_root_rule`, `org_unit_inactive`."
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitChange"
      responses:
        "200":
          description: "Phòng ban sau thay đổi"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /org-units/{orgUnitId}/heads:
    get:
      tags: ["Organization"]
      summary: "Lịch sử trưởng phòng ban (US-008)"
      operationId: "listOrgUnitHeads"
      description: "**Quyền:** HR."
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      responses:
        "200":
          description: "Các lần bổ nhiệm"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/HeadAssignment"
                required: ["items"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["Organization"]
      summary: "Bổ nhiệm trưởng phòng ban (US-008)"
      operationId: "appointHead"
      description: "**Quyền:** HR. **Mã lỗi:** `head_overlap`, `head_not_employed`."
      parameters:
        - $ref: "#/components/parameters/OrgUnitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                employeeId:
                  type: "string"
                  format: "uuid"
                from:
                  type: "string"
                  format: "date"
                to:
                  type: "string"
                  format: "date"
              required: ["employeeId", "from"]
      responses:
        "201":
          description: "Bổ nhiệm mới"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /head-assignments/{headAssignmentId}:
    patch:
      tags: ["Organization"]
      summary: "Thôi bổ nhiệm trưởng từ một ngày (US-008)"
      operationId: "endHeadAssignment"
      description: "**Quyền:** HR."
      parameters:
        - $ref: "#/components/parameters/HeadAssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                to:
                  type: "string"
                  format: "date"
              required: ["to"]
      responses:
        "200":
          description: "Bổ nhiệm sau khi sửa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeadAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /employees:
    get:
      tags: ["Employees"]
      summary: "Tìm và lọc nhân viên (US-018, US-020)"
      operationId: "listEmployees"
      description: "**Quyền:** HR thấy mọi người; Quản lý chỉ thấy phạm vi của mình (BR-013)."
      parameters:
        - name: "search"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Tên hoặc mã, không phân biệt dấu và hoa thường (EC-019)"
        - name: "orgUnitId"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "uuid"
        - name: "includeSubunits"
          in: "query"
          required: false
          schema:
            type: "boolean"
        - name: "positionId"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "uuid"
        - name: "status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum: ["upcoming", "active", "terminated"]
        - name: "contractType"
          in: "query"
          required: false
          schema:
            type: "string"
            enum: ["probation", "fixed_term", "indefinite", "none"]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "Một trang nhân viên"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["Employees"]
      summary: "Tiếp nhận nhân viên mới cùng quá trình công tác và hợp đồng đầu tiên (US-011, UC-001)"
      operationId: "onboardEmployee"
      description: "**Quyền:** HR. **Mã lỗi:** `national_id_taken`, `org_unit_inactive`, `contract_term_invalid`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreate"
      responses:
        "201":
          description: "Hồ sơ mới"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /employees/{employeeId}:
    get:
      tags: ["Employees"]
      summary: "Chi tiết nhân viên (US-012, US-018)"
      operationId: "getEmployee"
      description: "**Quyền:** HR; Quản lý với nhân viên trong phạm vi, chỉ phần công việc (BR-033)."
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: "Hồ sơ; phần `personal` chỉ có khi người xem là HR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: ["Employees"]
      summary: "Sửa thông tin cá nhân và liên hệ (US-012)"
      operationId: "updateEmployee"
      description: "**Quyền:** HR. **Mã lỗi:** `version_conflict`, `national_id_taken`."
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: "Hồ sơ sau khi sửa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /employees/{employeeId}/assignments:
    get:
      tags: ["Employees"]
      summary: "Quá trình công tác (US-013, US-018)"
      operationId: "listAssignments"
      description: "**Quyền:** HR; Quản lý với nhân viên trong phạm vi."
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: "Các quá trình công tác theo thời gian"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Assignment"
                required: ["items"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
